# ---------------------------------------------------------------
# Entorno de DESARROLLO LOCAL (no es lo que se entrega: la entrega
# usa un unico contenedor, Dockerfile de la raiz, Fase 5).
#
#   Fase 1: api (FastAPI :8000)
#   Fase 2: se anadira "web" (Vite :5173) con proxy /api -> api
#
# Uso:
#   docker compose up --build             -> arrancar la API
#   docker compose run --rm api pytest    -> ejecutar los tests
#   docker compose down                   -> parar y borrar los contenedores
# ---------------------------------------------------------------

services:
  # --- Backend (FastAPI) ----------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Las variables (clave de Groq incluida) se leen del .env al ARRANCAR:
    # nunca se copian dentro de la imagen
    env_file: .env
    # Ejecutar con tu mismo usuario (UID 1000) para que los archivos
    # que se creen en la carpeta montada sean tuyos y no de root
    user: "1000:1000"
    volumes:
      # Monta la carpeta del proyecto: los cambios en el codigo se ven al momento
      - .:/app
    ports:
      # 127.0.0.1 = accesible solo desde tu PC, no desde otros equipos de la red.
      # Documentacion interactiva: http://localhost:8000/api/docs
      - "127.0.0.1:8000:8000"
